<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tickets</title>

    <style>
        body{
            background-color: #54647c;
            font-family:cursive;
            color: aliceblue;
            margin: 50px;
            background-image: url(thedrivein.jpg);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .menu{
            background-color: #141e4c;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 5px 10px #364278;
            opacity: 95%;

        }
        .menu-title{
            background-color: #deddff;
            text-align: center;
            color: #000000;
            border-radius: 10px;
            padding: 10px;
            border-width: 40px;
            border: #5f1f31;
            border-style: groove;

        }
        h1{
            text-decoration: underline;

        }
        a{
            color:#000000;
        }
        .form-group{
            text-align: center;
        }
        label{
            display: block;
        }
        input[type=text], select {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        display: inline-block;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        }
        button {
        width: 100%;
        background-color:  #3c528d;
        color: white;
        padding: 14px;
        margin: 8px 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition-duration: .5s;
        }
        button:hover{
            background-color: #2f437a;
        }
        .ticket{
            text-align: center;
        }
        footer{
            text-align: center;
            color:#e5dc61;
            background-color: #000000;
        }
    </style>
</head>
<body>
    
    <div class="menu">

        <div class="menu-title">
        <h1><a href=thedrivein.jpg>PB's MOVIE DRIVE-IN</a></h1>
        <p> <img>🎟️ Movie Tickets!! 🎟️</p>
        </div>
        <br>
        <div class="form-group">
            <label for="genre">Movie Genre</label>
            <select id="genre">
                <option value="CoA">Coming of Age</option>
                <option value="Com">Comedy</option>
                <option value="Rom">Romance</option>
                <option value="Act">Action</option>
                <option value="Hor">Horror</option>
                <option value="ponyboy">Anything Paul Newman</option>
            </select>
        </div>

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text"
                id="title"
                placeholder="e.g The Outsiders">
        </div>

        <div class="form-group">
            <label for="movielength">Movie Length</label>
            <input type="text"
                id="movielength"
                placeholder="e.g 1 hr 31 mins">
        </div>

        <div class="form-group">
            <button class="order-btn" py-click="generateticket()">
                Generate Ticket !!
            </button>
        </div>

        <div class="ticket" id="ticket">
            <p id="skuticket">Get your ticket !</p>
        </div>


    </div>
    <br> <br>
    <footer>
        MAGLAYA, SOFIA ISABELLE
    </footer>
    <br>
    <script src="main.py"></script>
</body>
</html>
